name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # O app nao tem dependencia externa: migrar e rodar a suite basta.
      - run: python manage.py migrate --noinput
      - run: python manage.py test estudos --verbosity 2
