<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%NOME_DO_APP%</title>
    <meta name="description" content="%DESCRICAO_DO_APP%" />
    <meta name="apple-mobile-web-app-title" content="%NOME_DO_APP%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <!-- Resolve o tema antes da primeira pintura (ADR 0008, seção 6), para
         quem usa o celular no escuro não ver um clarão branco. O hook
         `useAplicarTema` (que roda depois, já com a configuração lida do
         banco) confirma ou substitui este valor. -->
    <script>
      document.documentElement.dataset.tema = matchMedia('(prefers-color-scheme: dark)').matches
        ? 'escuro'
        : 'claro';
    </script>
    <link rel="icon" href="/icones/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
