{% load estaticos %}<!doctype html>
<html lang="pt-br" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Quem está estudando? · Estudos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="{% estatico 'css/estilo.css' %}">

  <link rel="manifest" href="{% estatico 'manifest.json' %}">
  <link rel="icon" href="{% estatico 'icone-192.png' %}" sizes="192x192">
  <link rel="apple-touch-icon" href="{% estatico 'icone-apple-180.png' %}">
  <meta name="theme-color" content="#15161a">
</head>
<body class="tela-perfis">
  <header class="perfis-topo">
    <span class="marca">
      <svg class="marca-cubo" viewBox="0 0 24 24" aria-hidden="true">
        <path class="face-a" d="M12 1.5 22 7v0l-10 5.5L2 7z"></path>
        <path class="face-b" d="M2 7l10 5.5V23L2 17.5z"></path>
        <path class="face-c" d="M22 7l-10 5.5V23l10-5.5z"></path>
      </svg>
      Estudos
    </span>
  </header>

  <main class="perfis-palco">
    <h1 id="perfis-titulo">Quem está estudando?</h1>
    <p class="perfis-ajuda" id="perfis-ajuda">
      Cada perfil tem as próprias matérias, revisões e metas.
    </p>

    <div class="perfis-grade" id="perfis-grade"></div>

    <button type="button" class="botao botao-discreto" id="gerenciar">Gerenciar perfis</button>
  </main>

  {# destino dos avisos e dos dialogos criados em comum.js #}
  <div class="pilha-avisos" id="pilha-avisos" role="status" aria-live="polite"></div>

  {{ perfis|json_script:"perfis-iniciais" }}
  {{ cores|json_script:"cores" }}

  <script src="{% estatico 'js/comum.js' %}"></script>
  <script src="{% estatico 'js/perfis.js' %}"></script>
</body>
</html>
